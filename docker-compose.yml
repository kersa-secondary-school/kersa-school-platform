version: '3.8'

services:
  backend:
    build: ./backend
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=0
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "80:80"

  redis:
    image: redis:alpine

volumes:
  static_volume:
  media_volume: